    // Render Navigation Tree and Main Content Cards
    function renderApp() {
      const treeNav = document.getElementById("treeNav");
      const mainContent = document.getElementById("mainContent");

      treeNav.innerHTML = "";
      mainContent.innerHTML = "";

      screenData.forEach((cat, cIdx) => {
        // Nav Category Header
        const catGroup = document.createElement("div");
        catGroup.className = "space-y-1";
        
        const catTitle = document.createElement("div");
        catTitle.className = "text-[11px] font-bold uppercase tracking-wider text-slate-400 px-2 py-1";
        catTitle.innerText = `${cat.category} (${cat.items.length})`;
        catGroup.appendChild(catTitle);

        const catUl = document.createElement("ul");
        catUl.className = "space-y-0.5";

        // Main Content Category Section
        const sectionHeader = document.createElement("div");
        sectionHeader.className = "border-b border-slate-200 pb-3 mb-6 flex items-center justify-between";
        sectionHeader.innerHTML = `
          <h2 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-[#01916D]"></span>
            ${cat.category}
          </h2>
          <span class="text-xs font-semibold text-[#01916D] bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full">
            ${cat.items.length}개 화면 설계 수록
          </span>
        `;
        mainContent.appendChild(sectionHeader);

        const cardGrid = document.createElement("div");
        cardGrid.className = "grid grid-cols-1 xl:grid-cols-2 gap-6 mb-12";

        cat.items.forEach((screen) => {
          // Nav Item
          const navLi = document.createElement("li");
          navLi.innerHTML = `
            <a href="#${screen.id}" class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-slate-700 hover:bg-slate-100 hover:text-[#01916D] transition-all">
              <span class="truncate">${screen.title}</span>
              <span class="font-mono text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">${screen.id}</span>
            </a>
          `;
          catUl.appendChild(navLi);

          // Screen Detail Card
          const card = document.createElement("div");
          card.id = screen.id;
          card.className = "bg-white rounded-3xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all p-6 space-y-5 flex flex-col justify-between";
          card.innerHTML = `
            <div class="space-y-4">
              <!-- Top Bar -->
              <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-3">
                <div>
                  <div class="flex items-center space-x-2">
                    <span class="font-mono text-[11px] font-bold text-[#01916D] bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200/60">${screen.id}</span>
                    <h3 class="text-base font-bold text-slate-900">${screen.title}</h3>
                  </div>
                  <div class="mt-1 font-mono text-xs text-slate-500 font-medium">
                    URL: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700 font-semibold">${screen.url}</code>
                  </div>
                </div>

                <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200">
                  🔒 ${screen.auth}
                </span>
              </div>

              <!-- Screen Overview -->
              <p class="text-xs text-slate-600 leading-relaxed font-normal bg-slate-50 p-3 rounded-2xl border border-slate-100">
                ${screen.desc}
              </p>

              <!-- Components Grid -->
              <div class="space-y-1.5">
                <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wider">🖥️ 주요 UI 구성요소 Component</span>
                <div class="flex flex-wrap gap-1.5">
                  ${screen.components.map(c => `<span class="px-2.5 py-1 bg-slate-100 text-slate-700 text-[11px] rounded-lg border border-slate-200/60 font-medium">${c}</span>`).join('')}
                </div>
              </div>

              <!-- User Actions -->
              <div class="space-y-1.5">
                <span class="text-[11px] font-bold text-[#01916D] uppercase tracking-wider">⚡ 주요 기능 & 이벤트 Action</span>
                <ul class="text-xs text-slate-600 space-y-1 pl-4 list-disc font-medium">
                  ${screen.actions.map(a => `<li>${a}</li>`).join('')}
                </ul>
              </div>
            </div>

            <!-- Bottom Specs Bar -->
            <div class="pt-3 border-t border-slate-100 space-y-2 text-[11px]">
              <div class="flex items-center justify-between text-slate-500">
                <span>📡 REST API:</span>
                <span class="font-mono text-slate-700 font-semibold">${screen.apis.join(', ')}</span>
              </div>
              <div class="flex items-center justify-between text-slate-500">
                <span>🗄️ 관련 DB 테이블:</span>
                <span class="font-mono text-slate-600">${screen.db.map(d => `<code class="bg-slate-100 px-1 py-0.5 rounded">${d}</code>`).join(' ')}</span>
              </div>
            </div>
          `;
          cardGrid.appendChild(card);
        });

        catGroup.appendChild(catUl);
        treeNav.appendChild(catGroup);
        mainContent.appendChild(cardGrid);
      });
    }

    // Client Search Filter
    function filterScreens() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll("#mainContent > div.grid > div");
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(q) ? "flex" : "none";
      });
    }

    // Initialize Page
    document.addEventListener("DOMContentLoaded", renderApp);
  </script>
