    let currentSelectedId = "crm_customers";

    function renderNavTree() {
      const treeNav = document.getElementById("endpointNavTree");
      treeNav.innerHTML = "";

      const categories = Array.from(new Set(SCREEN_SPECS.map(s => s.category)));

      categories.forEach(cat => {
        const catHeader = document.createElement("div");
        catHeader.className = "px-2 pt-3 pb-1 text-xs font-bold text-slate-500 uppercase tracking-wider code-font border-b border-slate-200 mb-1.5";
        catHeader.textContent = cat;
        treeNav.appendChild(catHeader);

        const items = SCREEN_SPECS.filter(s => s.category === cat);
        items.forEach(spec => {
          const itemBtn = document.createElement("button");
          const isSelected = spec.id === currentSelectedId;

          itemBtn.className = `w-full text-left p-2.5 rounded-md transition-all cursor-pointer flex flex-col space-y-1 ${
            isSelected 
              ? "bg-[#01916D]/10 border border-[#01916D] text-slate-900" 
              : "bg-white hover:bg-slate-100/80 border border-slate-200 text-slate-700"
          }`;
          itemBtn.onclick = () => selectEndpoint(spec.id);

          const methodBadge = getVibrantMethodBadge(spec.method.split(" ")[0]);

          itemBtn.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-semibold text-xs text-slate-900">${spec.title}</span>
              ${methodBadge}
            </div>
            <div class="text-[11px] code-font font-normal text-slate-500 truncate">${spec.route}</div>
          `;
          treeNav.appendChild(itemBtn);
        });
      });
    }

    function getVibrantMethodBadge(method) {
      if (method.includes("GET")) {
        return `<span class="endpoint-badge bg-sky-600 text-white shadow-2xs">GET</span>`;
      }
      if (method.includes("POST")) {
        return `<span class="endpoint-badge bg-[#01916D] text-white shadow-2xs">POST</span>`;
      }
      if (method.includes("PATCH")) {
        return `<span class="endpoint-badge bg-amber-600 text-white shadow-2xs">PATCH</span>`;
      }
      if (method.includes("DELETE")) {
        return `<span class="endpoint-badge bg-rose-600 text-white shadow-2xs">DELETE</span>`;
      }
      return `<span class="endpoint-badge bg-slate-700 text-white">OPTION</span>`;
    }

    function selectEndpoint(id) {
      currentSelectedId = id;
      renderNavTree();
      renderConsoleDetail();
    }

              <span class="text-xs font-mono font-semibold text-[#01916D]">JSON FORMAT</span>
            </div>

            <!-- Request Body Schema -->
            <div class="space-y-1.5">
              <span class="text-xs font-mono font-bold text-slate-700 block">REQUEST PAYLOAD SCHEMA</span>
              <pre class="bg-slate-900 text-emerald-300 p-3.5 rounded-xl text-xs font-mono font-normal overflow-x-auto custom-scroll border border-slate-800">${JSON.stringify(spec.requestSchema, null, 2)}</pre>
            </div>

            <!-- Response Body Schema -->
            <div class="space-y-1.5">
              <span class="text-xs font-mono font-bold text-slate-700 block">RESPONSE DTO (200 OK)</span>
              <pre class="bg-slate-900 text-sky-300 p-3.5 rounded-xl text-xs font-mono font-normal overflow-x-auto custom-scroll border border-slate-800">${JSON.stringify(spec.responseSchema, null, 2)}</pre>
            </div>
          </div>

          <!-- Right: UI Component & Frontend Implementation Spec -->
          <div class="bg-white border border-slate-200 p-5 rounded-2xl space-y-4 shadow-xs">
            <div class="border-b border-slate-200 pb-2">
              <h3 class="text-xs font-mono font-bold text-blue-700 uppercase tracking-wider">
                [FRONTEND & UI COMPONENT SPECIFICATIONS]
              </h3>
            </div>

            <div class="space-y-3">
              <span class="text-xs font-mono font-bold text-slate-700 block">UI SPECIFICATION CHECKLIST</span>
              <ul class="space-y-2">
                ${spec.uiComponents.map(comp => `
                  <li class="flex items-start gap-2.5 bg-slate-50 border border-slate-200 p-2.5 rounded-lg text-xs font-normal text-slate-800">
                    <span class="w-2 h-2 rounded-full bg-[#01916D] mt-1 shrink-0"></span>
                    <span>${comp}</span>
                  </li>
                `).join("")}
              </ul>
            </div>

            <div class="p-3.5 bg-emerald-50/60 border border-emerald-200 rounded-xl space-y-1 text-xs">
              <span class="font-bold text-[#01916D] font-mono block">AUTHORITATIVE UI DESIGN COMPLIANCE</span>
              <p class="text-slate-600 text-xs font-normal leading-relaxed">
                Matches <code class="text-[#01916D] font-bold">operations/basic/contracts</code> standard: <code class="text-slate-800 font-medium">bg-[#FAFAFA]</code>, <code class="text-slate-800 font-medium">rounded-2xl Table</code>, Clean Glass Overlay Modal, and 0% Icon Text-First design guidelines.
              </p>
            </div>
          </div>

        </div>
      `;
    }

    function filterEndpoints() {
      const q = document.getElementById("apiSearchInput").value.toLowerCase();
      const items = document.querySelectorAll("#endpointNavTree button");

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(q)) {
          item.style.display = "block";
        } else {
          item.style.display = "none";
        }
      });
    }

    // Initial Load
    renderNavTree();
    renderConsoleDetail();
  </script>
</body>
</html>
