<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartnerOn v1.0 - 페이지별 기능 확장 & AI 고도화 로드맵 플랜 명세서</title>
  <!-- Google Fonts & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fujifilm: {
              DEFAULT: '#01916D',
              dark: '#006449',
              light: '#E6F4F0',
              accent: '#E01E35',
            }
          },
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #F8FAFC; }
    .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  </style>
</head>
<body class="text-slate-800 flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="glass-header border-b border-slate-200 sticky top-0 z-30 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-r from-[#01916D] to-[#80C342] flex items-center justify-center text-white font-black text-xl shadow-md">
        P
      </div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight text-slate-900 flex items-center gap-2">
          PartnerOn 페이지별 기능 확장 & AI 고도화 로드맵 플랜
          <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-[#01916D]">
            Phase 1 ~ Phase 3 Roadmap
          </span>
        </h1>
        <p class="text-xs text-slate-500">37개 전체 화면별 현재 상태 및 향후 AI 예측/자동화 기능 확장 로드맵 명세서</p>
      </div>
    </div>

    <!-- Phase Badges Legend -->
    <div class="hidden md:flex items-center space-x-3 text-xs font-semibold">
      <span class="px-3 py-1 rounded-full bg-emerald-100 text-[#01916D] border border-emerald-200">
        ✅ Phase 1 (v1.0 완성)
      </span>
      <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-800 border border-amber-200">
        🚀 Phase 2 (v1.5 차기 플랜)
      </span>
      <span class="px-3 py-1 rounded-full bg-purple-100 text-purple-800 border border-purple-200">
        🤖 Phase 3 (v2.0 AI/엔터프라이즈)
      </span>
    </div>
  </header>

  <!-- Main Content Workspace -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Sidebar Category Selector -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col p-4 space-y-2 z-20">
      <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2">영역별 플랜 바로가기</span>
      <nav class="space-y-1 text-xs font-medium" id="sideNav">
        <!-- Generated by JS -->
      </nav>
    </aside>

    <!-- Main Specification Cards Grid -->
    <main class="flex-1 overflow-y-auto custom-scroll p-6 md:p-8 space-y-8 bg-slate-50/50" id="mainSpecGrid">
      <!-- Generated by JS -->
    </main>

  </div>

  <script>
    const planCategories = [
      {
        category: "인증 & 보안 (Auth & Security)",
        id: "cat-auth",
        items: [
          {
            page: "로그인 페이지 (/login)",
            phase1: "이메일 ID/PW 로그인, 2FA 평가, TOTP/Email OTP 검증",
            phase2: "FIDO2 생체 인증(Passkey/지문/FaceID), 소셜 로그인(카카오/구글)",
            phase3: "IP 세션 이상 감지 시 즉시 세션 격리 및 관리자 긴급 알림 팝업"
          },
          {
            page: "마이 프로필 & 2FA 보안 (/profile)",
            phase1: "개인 프로필 수정, TOTP QR 발급, 비상 복구 코드 10개 관리",
            phase2: "2FA 비상 복구 코드 사용 시 카카오 알림톡 실시간 발송",
            phase3: "보안 접근 이력 Audit Log 다운로드"
          },
          {
            page: "대표 승인 기기 통제 (/operations/basic/devices)",
            phase1: "브라우저 고유 UUID 핑거프린트 승인/거절 통제",
            phase2: "승인 요청 기기 접속 시 대표자 앱 Push 알림 & 1-Tap 즉시 승인",
            phase3: "위험 IP 자동 차단 블랙리스트 AI 연동"
          }
        ]
      },
      {
        category: "기초정보 & OID (Basic & Master Data)",
        id: "cat-basic",
        items: [
          {
            page: "메뉴 권한 관리 (/operations/basic/permissions)",
            phase1: "4단계 직급 25개 소분류 RBAC 매트릭스",
            phase2: "사용자 정의 직급(Custom Role) 생성 및 읽기/쓰기/삭제 3단계 권한 세분화",
            phase3: "부서별 자산 접근 권한 분리 격리"
          },
          {
            page: "OID 검증 및 승인 관리 (/operations/basic/oid-lists)",
            phase1: "독립 SNMP Deep Search Agent 덤프 대조 및 정식 마스터 DB 승인 이관",
            phase2: "신규 미지 모델 스캔 시 클라우드 MIB DB 비교 후 14대 OID 자동 매칭 템플릿 추천",
            phase3: "OID 딥러닝 학습 AI 엔진을 통한 타사 복합기 OID 100% 자동 해독"
          }
        ]
      },
      {
        category: "자산 & 수집기 (Assets & Collectors)",
        id: "cat-assets",
        items: [
          {
            page: "장비 현황 (/operations/assets/devices)",
            phase1: "정식 복합기 자산 등록, 시리얼/IP/위치 관리",
            phase2: "장비별 QR 코드 스티커 출력 기능 (현장 A/S 접수용 QR)",
            phase3: "장비 감가상각 및 교체 타이밍 자동 계산"
          },
          {
            page: "미등록 장비 관리 (/operations/assets/unregistered)",
            phase1: "탐지된 미등록 복합기 분리 관제 및 정식 자산 승인 전환",
            phase2: "미등록 장비 등록 시 스캔된 IP 기반 서브넷 위치 자동 추론 템플릿 적용",
            phase3: "사내 무단 설치 복합기 위협 탐지 및 보안 조치"
          }
        ]
      },
      {
        category: "모니터링 & A/S 관제 (Monitoring & Field Service)",
        id: "cat-monitoring",
        items: [
          {
            page: "사용량 관제 (카운터) (/operations/monitoring/usage)",
            phase1: "컬러/흑백/총합 카운터 단조 증가 보장 및 사용량 트렌드",
            phase2: "고객사 월 약정 매수 초과 예상 시 사전 경고 알림톡 발송",
            phase3: "사용 패턴 분석 기반 맞춤형 요금제 추천 엔진"
          },
          {
            page: "소모품 관제 (토너/드럼) (/operations/monitoring/supplies)",
            phase1: "토너 C/M/Y/K 및 드럼 4종 잔량 % 게이지 & 20% 이하 소모품 경고",
            phase2: "토너 소모 속도 기반 AI 소모품 교체 잔여일 자동 예측 (ML) 및 자동 택배 배송",
            phase3: "소모품 이상 고장(드럼 수명 급감 등) AI 고장 패턴 감지"
          },
          {
            page: "오늘의 A/S (모바일용) (/operations/monitoring/as/today)",
            phase1: "모바일 최적화 CE 방문 일정 및 조치 등록",
            phase2: "고객 전자서명(Sign-Pad) 수취 및 현장 자재 교체 시 바코드 스캔 연동",
            phase3: "CE 엔지니어 이동 동선 최적화 GPS 길안내 연동"
          }
        ]
      },
      {
        category: "계약 & 청구 (Contracts & Invoicing)",
        id: "cat-contracts",
        items: [
          {
            page: "명세서 발행 / 완료 (/operations/contracts/invoices)",
            phase1: "초과 사용 매수 정산 및 렌탈료 청구 명세서 계산/발행",
            phase2: "국세청 연동 전자세금계산서 1-Click 자동 발행",
            phase3: "카카오페이/신용카드 자동 수금 및 미납 대금 자동 독촉 발송"
          }
        ]
      }
    ];

    function renderPlanApp() {
      const sideNav = document.getElementById("sideNav");
      const mainGrid = document.getElementById("mainSpecGrid");

      sideNav.innerHTML = "";
      mainGrid.innerHTML = "";

      planCategories.forEach((cat) => {
        // Side Nav Item
        const a = document.createElement("a");
        a.href = `#${cat.id}`;
        a.className = "flex items-center px-3 py-2 rounded-xl text-slate-700 hover:bg-[#01916D]/10 hover:text-[#01916D] transition-all";
        a.innerText = cat.category.split('(')[0];
        sideNav.appendChild(a);

        // Section Title
        const secHeader = document.createElement("div");
        secHeader.id = cat.id;
        secHeader.className = "border-b border-slate-200 pb-3 mb-6 flex items-center justify-between";
        secHeader.innerHTML = `
          <h2 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
            <span class="w-3.5 h-3.5 rounded-full bg-[#01916D]"></span>
            ${cat.category}
          </h2>
        `;
        mainGrid.appendChild(secHeader);

        // Cards Container
        const grid = document.createElement("div");
        grid.className = "space-y-6 mb-12";

        cat.items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-4 hover:shadow-md transition-all";
          card.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                📄 ${item.page}
              </h3>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <!-- Phase 1 -->
              <div class="bg-emerald-50/60 border border-emerald-200/80 p-4 rounded-2xl space-y-2">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-[#01916D]">
                  ✅ Phase 1 (v1.0 현재 완성)
                </span>
                <p class="text-slate-700 leading-relaxed font-medium mt-2">${item.phase1}</p>
              </div>

              <!-- Phase 2 -->
              <div class="bg-amber-50/60 border border-amber-200/80 p-4 rounded-2xl space-y-2">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">
                  🚀 Phase 2 (v1.5 차기 플랜)
                </span>
                <p class="text-slate-700 leading-relaxed font-medium mt-2">${item.phase2}</p>
              </div>

              <!-- Phase 3 -->
              <div class="bg-purple-50/60 border border-purple-200/80 p-4 rounded-2xl space-y-2">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-purple-100 text-purple-800">
                  🤖 Phase 3 (v2.0 엔터프라이즈)
                </span>
                <p class="text-slate-700 leading-relaxed font-medium mt-2">${item.phase3}</p>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

        mainGrid.appendChild(grid);
      });
    }

    document.addEventListener("DOMContentLoaded", renderPlanApp);
  </script>
</body>
</html>
